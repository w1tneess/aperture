name: Copyright / takedown request
description: Ask for content or behaviour to be removed from the public instance
labels: [takedown]
body:
  - type: markdown
    attributes:
      value: |
        Aperture does not host or store media: files exist on the server only for minutes while a visitor downloads them.
        If you believe the public instance is being used to infringe your rights, describe it below and we'll respond promptly.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Your relationship to the content, the URL(s) concerned, and what you'd like done.
    validations: { required: true }
  - type: input
    id: contact
    attributes: { label: Contact (optional), description: "How to reach you if we need more information." }
